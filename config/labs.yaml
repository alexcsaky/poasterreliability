# Labs covered by the release ledger (Stage 1).
# official_domains: sources accepted as ground truth for this lab. A ledger row is valid only if
# at least one of its source_urls is on one of these domains (or is a web.archive.org snapshot of one).
# x_accounts: official lab accounts. Their posts are official signals, never cohort members.
# flagship_lines: model families treated as tier=flagship (see RULES.md, "Tier").
labs:
  - id: openai
    name: OpenAI
    official_domains: [openai.com, chatgpt.com, learn.chatgpt.com, help.openai.com, platform.openai.com, cdn.openai.com, developers.openai.com, community.openai.com, github.com/openai, huggingface.co/openai, x.com/OpenAI, x.com/OpenAIDevs, x.com/ChatGPTapp, x.com/sama]
    x_accounts: [OpenAI, OpenAIDevs, ChatGPTapp, OpenAINewsroom, sama]
    flagship_lines: ["GPT-5", "GPT-6", "o-series reasoning (top tier)"]
  - id: anthropic
    name: Anthropic
    official_domains: [anthropic.com, www.anthropic.com, docs.anthropic.com, docs.claude.com, platform.claude.com, claude.com, support.claude.com, support.anthropic.com, x.com/AnthropicAI, x.com/claudeai]
